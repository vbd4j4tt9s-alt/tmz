<html><head><meta charset="utf-8"><title>Verity preview</title>

<script type="module">

// The smiley stand-in: a thin black line drawing on a transparent background (two eyes and a wide smile), like the owner's picture.
function smiley(){
  const cv=document.createElement('canvas');cv.width=cv.height=512;const g=cv.getContext('2d');

const SMILEY=smiley();
// A yellow ball with Decals: Roblox projects a face Decal straight onto the part along that face's axis (Front = -Z), so the

function decalBall(color,decals){

  const img=g.createImageData(tw,th);const front=decals.some(d=>d.face==='Front'),back=decals.some(d=>d.face==='Back');

function signSprite(sign){

  g.font='900 130px "Arial Rounded MT Bold","DejaVu Sans",sans-serif';g.lineWidth=14;g.strokeStyle='rgba(40,22,70,1)';g.strokeText(sign.mark,240,62);g.fillStyle='#fff';g.fillText(sign.mark,240,62);

// A Roblox-sized avatar (about 5 studs tall) for scale.
function person(x,y,z,shirt){

  const torso=new THREE.Mesh(new THREE.BoxGeometry(2,2,1),m(shirt));torso.position.set(0,3,0);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.65,16,12),m(0xf1c27d));head.position.set(0,4.55,0);
  for(const o of[legs,torso,head]){o.castShadow=true;grp.add(o)}

window.build=function(scene,mode){

  s.add(new THREE.AmbientLight(dusk?0x8090b0:0xbfc8d8,dusk?.35:.75));

  const sun=new THREE.DirectionalLight(dusk?0xffa070:0xfff2dd,dusk?.55:2.4);

  sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);Object.assign(sun.shadow.camera,{left:-95,right:95,top:95,bottom:-95,near:1,far:320});sun.shadow.bias=-.0004;

  const box=new THREE.BoxGeometry(1,1,1),sphere=new THREE.SphereGeometry(.5,64,40),cyl=new THREE.CylinderGeometry(.5,.5,1,48);cyl.rotateZ(-Math.PI/2);
  const wedge=(()=>{const g=new THREE.BufferGeometry();const P=[];const tri=(a,b,c)=>P.push(...a,...b,...c);
    const A=[-.5,-.5,-.5],B=[-.5,-.5,.5],C=[-.5,.5,.5],D=[.5,-.5,-.5],E=[.5,-.5,.5],F=[.5,.5,.5];

window.shoot=function(scene,view,mode){
