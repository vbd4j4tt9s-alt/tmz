<!doctype html>
<html><head><meta charset="utf-8"><title>Weather preview</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Approximate render of a dump_weather.luau scene. Roblox coordinates map straight to three.js (both right handed, Y up). The particles
// are SIMULATED here from the numbers the real emitters were set to (tile rectangle and height, rate, speed range, lifetime range,
// acceleration, spread): each emitter gets rate x lifetime particles at random ages, exactly the steady state a Roblox emitter reaches.
// Rain = streaks along the velocity, snow = soft dots, splashes = spray dots + flat ripple rings on the ground. No Roblox lighting,
// textures or materials: a design preview, not a Roblox screenshot.
import * as THREE from 'three';
import {LineSegments2} from 'three/addons/lines/LineSegments2.js';
import {LineSegmentsGeometry} from 'three/addons/lines/LineSegmentsGeometry.js';
import {LineMaterial} from 'three/addons/lines/LineMaterial.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);
const col=c=>new THREE.Color().setRGB(c[0]/255,c[1]/255,c[2]/255,THREE.SRGBColorSpace);
const geoBox=new THREE.BoxGeometry(1,1,1);
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dotTexture(){const cv=document.createElement('canvas');cv.width=cv.height=64;const g=cv.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.45,'rgba(255,255,255,.85)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t}
function avatar(x,y,z){
  const grp=new THREE.Group();const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.7});
  const box=(sx,sy,sz,px,py,pz,c)=>{const m=new THREE.Mesh(geoBox,mat(c));m.scale.set(sx,sy,sz);m.position.set(px,py,pz);grp.add(m)};
  box(.9,2,1,-.5,1,0,0x2f4a8f);box(.9,2,1,.5,1,0,0x2f4a8f);box(2,2,1,0,3,0,0xd23b3b);box(1,2,1,-1.5,3,0,0xe8bd9a);box(1,2,1,1.5,3,0,0xe8bd9a);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.9,24,16),mat(0xe8bd9a));head.position.set(0,4.6,0);grp.add(head);
  grp.scale.setScalar(1.25);grp.position.set(x,y,z);return grp;
}
const dotTex=dotTexture();
window.shoot=function(scene,W,H,view){
  renderer.setSize(W,H);
  const s=new THREE.Scene();s.background=new THREE.Color(view.bg);
  if(view.fog)s.fog=new THREE.Fog(view.bg,view.fog[0],view.fog[1]);
  s.add(new THREE.HemisphereLight(view.sky||0xdfe8f5,view.gnd||0x6a7280,view.light||1.3));
  const sun=new THREE.DirectionalLight(0xfff0d8,view.sun??1.2);sun.position.set(60,120,-80);s.add(sun);
  const G=scene.ground;
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),new THREE.MeshStandardMaterial({color:view.floor||0xa9a894,roughness:1}));
  ground.rotation.x=-Math.PI/2;ground.position.set(0,G-.02,0);s.add(ground);
  // garden beds (soil) with a low wooden edge
  for(const [x,z,hx,hz] of scene.plots){
    const edge=new THREE.Mesh(geoBox,new THREE.MeshStandardMaterial({color:0x91694a,roughness:.9}));edge.scale.set(hx*2+1.2,.5,hz*2+1.2);edge.position.set(x,G+.15,z);s.add(edge);
    const soil=new THREE.Mesh(geoBox,new THREE.MeshStandardMaterial({color:0x6a4a33,roughness:1}));soil.scale.set(hx*2,.5,hz*2);soil.position.set(x,G+.2,z);s.add(soil);
    for(let i=0;i<5;i++){const c=new THREE.Mesh(new THREE.ConeGeometry(1.1,3.2,7),new THREE.MeshStandardMaterial({color:i%2?0x4a9a46:0x5fb257,roughness:.8}));c.position.set(x-hx*.6+(i%3)*hx*.6,G+2,z-hz*.4+Math.floor(i/3)*hz*.8);s.add(c)}
  }
  // keyboard parts (bed + keys + blocks) as instanced boxes
  if(scene.keys.length){
    const im=new THREE.InstancedMesh(geoBox,new THREE.MeshStandardMaterial({roughness:.6}),scene.keys.length);
    const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),v=new THREE.Vector3(),sc=new THREE.Vector3();
    scene.keys.forEach((p,i)=>{m4.compose(v.set(...p.p),q,sc.set(...p.s));im.setMatrixAt(i,m4);im.setColorAt(i,col(p.c))});
    im.instanceMatrix.needsUpdate=true;if(im.instanceColor)im.instanceColor.needsUpdate=true;s.add(im);
  }
  // snow patches: flat ellipses (Cylinder parts: Size.Y along the yawed X axis, Size.Z along the yawed Z axis)
  const cyl=new THREE.CylinderGeometry(.5,.5,1,28);
  for(const d of scene.patches){
    const m=new THREE.Mesh(cyl,new THREE.MeshStandardMaterial({color:col(d.c),roughness:.9,transparent:d.t>0,opacity:1-d.t,depthWrite:d.t<.5}));
    m.scale.set(d.s[1],d.s[0],d.s[2]);m.rotation.y=d.yaw;m.position.set(...d.p);s.add(m);
  }
  // particles
  const R=rng(149);const rainLines=[],rainCols=[];const snowPos=[],sprayPos=[],ripLines=[];let drops=0,flakes=0,sprays=0,ripples=0;
  const wrapRipple=(x,y,z,r)=>{const k=14;for(let i=0;i<k;i++){const a=i/k*Math.PI*2,b=(i+1)/k*Math.PI*2;ripLines.push(x+Math.cos(a)*r,y,z+Math.sin(a)*r,x+Math.cos(b)*r,y,z+Math.sin(b)*r)}};
  for(const t of scene.tiles){
    const life=(t.life[0]+t.life[1])/2;const live=Math.min(4000,Math.round(t.rate*life*(view.density||1)));
    const th=t.spread*Math.PI/180;
    for(let i=0;i<live;i++){
      const px=t.c[0]+(R()-.5)*t.s[0],pz=t.c[2]+(R()-.5)*t.s[1],py=t.c[1];
      const sp=t.sp[0]+(t.sp[1]-t.sp[0])*R();const tx=(R()*2-1)*th,tz=(R()*2-1)*th;
      const vx=sp*Math.sin(tx),vz=sp*Math.sin(tz),vy=-sp*Math.cos(Math.max(Math.abs(tx),Math.abs(tz)));
      const age=R()*t.life[0];
      const x=px+vx*age+.5*t.acc[0]*age*age,y=py+vy*age+.5*t.acc[1]*age*age,z=pz+vz*age+.5*t.acc[2]*age*age;
      if(y<t.gy)continue;
      if(t.snow){snowPos.push(x,y,z);flakes++}
      else{const cx=vx+t.acc[0]*age,cy=vy+t.acc[1]*age,cz=vz+t.acc[2]*age;const L=.045;
        rainLines.push(x,y,z,x-cx*L,y-cy*L,z-cz*L);drops++}
    }
    // splashes under the tile (the ground emitters)
    const [sr,sl]=t.spray,[rr,rl]=t.ripple;const gx0=t.c[0]-t.s[0]/2,gz0=t.c[2]-t.s[1]/2;
    for(let i=0,n=Math.round(sr*sl*(view.density||1));i<n;i++){const a=R()*sl;const h=6*a-.5*42*a*a;if(h<0)continue;sprayPos.push(gx0+R()*t.s[0],t.gy+h+.05,gz0+R()*t.s[1]);sprays++}
    for(let i=0,n=Math.round(rr*rl*(view.density||1));i<n;i++){const k=R();wrapRipple(gx0+R()*t.s[0],t.gy+.08,gz0+R()*t.s[1],(.3+2.1*k)/2);ripples++}
  }
  if(rainLines.length){
    const g=new LineSegmentsGeometry();g.setPositions(rainLines);
    const lm=new LineMaterial({color:view.rain||0xb8d6f2,linewidth:view.rainWidth||1.6,transparent:true,opacity:view.rainOpacity||.55,worldUnits:false});lm.resolution.set(W,H);
    s.add(new LineSegments2(g,lm));
  }
  if(snowPos.length){
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(snowPos,3));
    s.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:view.flake||.9,map:dotTex,transparent:true,opacity:.9,depthWrite:false,sizeAttenuation:true})));
  }
  if(sprayPos.length){
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(sprayPos,3));
    s.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xd6eaff,size:.45,map:dotTex,transparent:true,opacity:.85,depthWrite:false,sizeAttenuation:true})));
  }
  if(ripLines.length){
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(ripLines,3));
    s.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0xcfe6f7,transparent:true,opacity:.55})));
  }
  // top-view overlay: tile rectangles, the track rectangle, the world grid
  if(view.overlay){
    const y=G+.4;const rect=(x0,x1,z0,z1,color,op)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,z1-z0),new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.set((x0+x1)/2,y,(z0+z1)/2);s.add(m)};
    for(const t of scene.tiles){const op=Math.min(.55,.1+t.rate/700);rect(t.c[0]-t.s[0]/2,t.c[0]+t.s[0]/2,t.c[2]-t.s[1]/2,t.c[2]+t.s[1]/2,0x2c8ee0,op)
      const e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(t.s[0],t.s[1])),new THREE.LineBasicMaterial({color:0x0a4a86}));e.rotation.x=-Math.PI/2;e.position.set(t.c[0],y+.05,t.c[2]);s.add(e)}
    const [x0,x1,z0,z1]=scene.track;rect(x0,x1,z0,z1,0xe06a9a,.35)
    for(let gx=-300;gx<=300;gx+=50){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(gx,y+.1,-400),new THREE.Vector3(gx,y+.1,0)]),new THREE.LineBasicMaterial({color:0x333333,transparent:true,opacity:.35}));s.add(l)}
    for(let gz=-400;gz<=0;gz+=50){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-300,y+.1,gz),new THREE.Vector3(300,y+.1,gz)]),new THREE.LineBasicMaterial({color:0x333333,transparent:true,opacity:.35}));s.add(l)}
    const pm=new THREE.Mesh(new THREE.CylinderGeometry(3,3,1,20),new THREE.MeshBasicMaterial({color:0xffd23a}));pm.position.set(scene.player[0],y+.6,scene.player[2]);s.add(pm);
  } else s.add(avatar(scene.player[0],scene.player[1]-3,scene.player[2]));
  let cam;
  if(view.ortho){const hw=view.ortho.w/2,hh=view.ortho.h/2;cam=new THREE.OrthographicCamera(-hw,hw,hh,-hh,1,3000);cam.up.set(0,0,1);}
  else cam=new THREE.PerspectiveCamera(view.fov,W/H,.1,4000);
  cam.position.set(...view.pos);cam.lookAt(new THREE.Vector3(...view.look));
  renderer.render(s,cam);
  window.stats={drops,flakes,sprays,ripples,patches:scene.patches.length,keys:scene.keys.length,tiles:scene.tiles.length};
  return renderer.domElement.toDataURL('image/png');
};
window.ready=true;
</script></body></html>
