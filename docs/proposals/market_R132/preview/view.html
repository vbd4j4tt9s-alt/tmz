<html><head><meta charset="utf-8"><title>Market preview</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>

</head><body>
<script type="module">
// Approximate render of a dump_market.luau scene: Roblox parts as boxes / balls / cylinders, SurfaceGui text on faces,
// neon as glowing unlit colour. No Roblox textures, real fonts or Future lighting: a design preview, not a screenshot.
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';

const W=1600,H=900;

function textCanvas(gui,wStuds,hStuds){

function grid(){

window.build=function(scene,mode){

  ground.rotation.x=-Math.PI/2;ground.position.set(c[0],c[1]-.02,c[2]);ground.receiveShadow=true;s.add(ground);
  const box=new THREE.BoxGeometry(1,1,1),sphere=new THREE.SphereGeometry(.5,28,18),cyl=new THREE.CylinderGeometry(.5,.5,1,40);cyl.rotateZ(-Math.PI/2);

    const A=[-.5,-.5,-.5],B=[-.5,-.5,.5],C=[-.5,.5,.5],D=[.5,-.5,-.5],E=[.5,-.5,.5],F=[.5,.5,.5];
    tri(A,C,B);tri(D,E,F);tri(A,B,E);tri(A,E,D);tri(B,C,F);tri(B,F,E);tri(A,D,F);tri(A,F,C);

        case'Back':w=sx;h=sy;local.makeTranslation(0,0,sz/2+off);break;
        case'Right':w=sz;h=sy;local.makeRotationY(Math.PI/2).setPosition(sx/2+off,0,0);break;
        case'Left':w=sz;h=sy;local.makeRotationY(-Math.PI/2).setPosition(-sx/2-off,0,0);break;

  return s;
};
window.shoot=function(scene,view,mode){

window.ready=true;
</script></body></html>
