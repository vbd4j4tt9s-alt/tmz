<script type="module">
// Approximate render of a dump_pedestal.luau scene: Roblox parts as boxes / cylinders / balls (the pack's stand-in Body as a rounded pouch), neon as

// as a light, and the BillboardGui sign drawn like Roblox would (rounded pill, outline, caption / state line / bar) as a camera-facing sprite sized in

import * as THREE from 'three';

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});

  g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=3;g.strokeRect(0,0,256,256);
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(60,60);t.colorSpace=THREE.SRGBColorSpace;return t;

const glowTex=(()=>{const cv=document.createElement('canvas');cv.width=cv.height=64;const c=cv.getContext('2d');const gr=c.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.3,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=gr;c.fillRect(0,0,64,64);return new THREE.CanvasTexture(cv)})();

function glow(s,pos,color,size,opacity){

// The sign: BillboardGui items drawn on a canvas (Roblox's layout: scale positions / sizes inside the gui's studs size), shown as a sprite.
function guiSprite(g){

  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  const rgb=(a,al)=>`rgba(${a[0]},${a[1]},${a[2]},${al})`;

  const byName={};for(const it of items)byName[it.name]=it;
  const box=it=>{

    const w=it.w*pw,h=it.h*ph;return {x:px+it.x*pw-it.ax*w,y:py+it.y*ph-it.ay*h,w,h}

      const a=1-it.bgT;

window.shoot=function(scene,Wd,Ht,opts){

  s.fog=new THREE.Fog(opts.bg||0xa9d8f5,260,700);

    const geo=p.sh==='Ball'?geoSphere:p.sh==='Cylinder'?geoCyl:p.sh==='Pouch'?geoPouch:geoBox;
    let mat;const neon=p.m==='Neon';
    if(neon)mat=new THREE.MeshBasicMaterial({color:col(p.c).multiplyScalar(1.1),transparent:p.t>0,opacity:1-p.t,toneMapped:false,depthWrite:p.t<.5});
    else if(p.m==='Glass'||p.m==='Ice')mat=new THREE.MeshPhysicalMaterial({color:col(p.c),roughness:p.m==='Ice'?.25:.08,transparent:true,opacity:p.m==='Ice'?.9:.55,clearcoat:1,envMap:envTex,envMapIntensity:.7,depthWrite:p.m==='Ice'});
    else{
      const rough={Wood:.7,Marble:.28,Slate:.82,Basalt:.9,Sandstone:.92,Metal:.32,SmoothPlastic:.5,Plastic:.6}[p.m]??.7;
      mat=new THREE.MeshStandardMaterial({color:col(p.c),roughness:rough,metalness:p.m==='Metal'?.8:0,transparent:p.t>0,opacity:1-p.t});
      if(p.m==='Metal'){mat.envMap=envTex;mat.envMapIntensity=.9}

      for(let i=0;i<e.count;i++){const th=R()*Math.PI*2,ph=Math.acos(2*R()-1),r=(.3+R()*.7)*e.speed*e.life*.7;pts.push(e.p[0]+Math.sin(ph)*Math.cos(th)*r,e.p[1]+Math.cos(ph)*r,e.p[2]+Math.sin(ph)*Math.sin(th)*r)}

};
window.ready=true;
