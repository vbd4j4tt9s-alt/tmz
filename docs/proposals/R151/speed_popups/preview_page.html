<!doctype html>
<html><head><meta charset="utf-8"><title>speed popups preview</title>
<style>
/*FONT*/
:root{--ink:#e8eef5;--mute:#9db0c4;--bg:#10161d;--card:#18212b;--line:#2b3846;--acc:#7df8ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DejaVu Sans',Arial,sans-serif}
#strip{width:1760px;padding:22px 24px 26px;background:var(--bg)}
h1{font-size:25px;margin:0 0 4px;font-weight:700}
.sub{color:var(--mute);font-size:14px;margin:0 0 16px;line-height:1.45;max-width:1500px}
h2{font-size:16px;margin:22px 0 8px;color:var(--acc);font-weight:700}
.grid{display:grid;grid-template-columns:170px repeat(5,300px);gap:6px 6px;align-items:start}
.rowlab{overflow-wrap:anywhere;font-size:13px;line-height:1.35;padding:6px 8px 0 0}
.rowlab b{display:block;font-size:14px;color:#fff;margin-bottom:2px}
.rowlab span{color:var(--mute)}
.colhead{font-size:13px;color:var(--mute);text-align:center;padding-bottom:2px}
.cellwrap{width:300px;height:248px;overflow:hidden;border-radius:8px;border:1px solid var(--line)}
.cellwrap .panel{transform:scale(.75);transform-origin:0 0}
.panel{position:relative;width:400px;height:330px;overflow:hidden;background:linear-gradient(180deg,#9fd96b 0%,#82cc55 60%,#6fb946 100%)}
.panel .belt{position:absolute;left:92px;top:262px;width:216px;height:120px;background:repeating-linear-gradient(180deg,#2c4a38 0 10px,#274232 10px 20px);clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);opacity:.9}
.panel .post{position:absolute;top:215px;width:20px;height:90px;background:#2a3140;border-radius:3px}
.panel .torso{position:absolute;left:171px;top:238px;width:58px;height:58px;background:#1d2433;border-radius:4px}
.panel .scarf{position:absolute;left:171px;top:238px;width:58px;height:14px;background:#d83a3a;border-radius:4px 4px 0 0}
.panel .arm{position:absolute;top:240px;width:16px;height:46px;background:#1d2433;border-radius:4px}
.panel .leg{position:absolute;top:294px;width:24px;height:44px;background:#2b3a66;border-radius:4px}
.panel .head{position:absolute;left:178px;top:193px;width:44px;height:44px;background:#f0c28c;border-radius:6px}
.panel .hair{position:absolute;left:176px;top:190px;width:48px;height:20px;background:#c8742c;border-radius:9px 9px 3px 3px}
.pop{position:absolute;white-space:nowrap;will-change:transform}
.pop .ico{display:inline-block;font-family:'Noto Color Emoji','Segoe UI Emoji',sans-serif;line-height:1;filter:drop-shadow(0 0 1.2px #000) drop-shadow(0 0 1.2px #000)}
.pop .amt{display:inline-block;font-family:'RbxFredoka','Fredoka One','DejaVu Sans',sans-serif;font-weight:700;line-height:1;-webkit-text-stroke:5px #111a2a;paint-order:stroke fill}
.pop.now{width:178px;height:48px}
.pop.now .ico{position:absolute;left:0;top:0;width:34px;height:42px;text-align:center;padding-top:8px;font-size:24px}
.pop.now .amt{position:absolute;left:31px;top:0;width:145px;height:48px;text-align:center;font-size:26px;padding-top:11px}
.pop.new{display:flex;align-items:center;justify-content:center;gap:4px;width:150px;height:36px}
.pop.new .ico{font-size:20px}
.pop.new .amt{font-size:22px}
.tag{position:absolute;left:8px;top:6px;font-size:13px;color:#10331a;background:rgba(255,255,255,.55);padding:1px 6px;border-radius:5px;font-family:'DejaVu Sans',sans-serif}
.plots{display:flex;gap:14px}
.plot{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px}
.plot h3{margin:0 0 4px;font-size:13px;color:#fff}
.plot p{margin:4px 0 0;font-size:11.5px;color:var(--mute);line-height:1.35;width:500px}
table{border-collapse:collapse;font-size:12.5px;width:100%}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;line-height:1.35}
th{background:#1d2935;color:#fff}
td.k{color:#fff;font-weight:700;white-space:nowrap}
td.n{color:#ffd9d9}td.r{color:#cfe6ff}td.p{color:#c9ffd6}
.two{display:flex;gap:16px;align-items:flex-start}
.note{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.45;max-width:1600px}
#gif{display:inline-flex;gap:8px;background:var(--bg);padding:8px}
.gcol{width:400px}
.gcol .cap{font-size:14px;color:#fff;padding:0 0 5px 2px;font-family:'DejaVu Sans',sans-serif;height:24px;white-space:nowrap}
.gcol .cap span{color:var(--mute);font-size:12px}
.gcol .panel{border-radius:8px}
</style></head>
<body>
<div id="strip"></div>
<div id="gif"></div>
<script>
const DATA=/*DATA*/null;
const FPS=30;
const OUT=(t)=>'rgba(17,26,42,'+t+')';
function pop(kind,p){
  const cx=200,cy=215;
  const st=(w,h)=>'left:'+(cx+p.x-w/2).toFixed(2)+'px;top:'+(cy+p.y-h/2).toFixed(2)+'px;transform:scale('+p.s.toFixed(3)+');opacity:1;';
  if(kind==='now'){
    return '<div class="pop now" style="'+st(178,48)+'"><span class="ico" style="transform:rotate('+p.ri+'deg);opacity:'+p.a.toFixed(3)+'">⚡</span>'+
      '<span class="amt" style="transform:rotate('+p.rt+'deg);color:rgba(125,248,255,'+p.a.toFixed(3)+');-webkit-text-stroke-color:'+OUT(p.sa.toFixed(3))+'">'+p.txt+'</span></div>';
  }
  return '<div class="pop new" style="'+st(150,36)+';opacity:'+p.a.toFixed(3)+'"><span class="ico" style="transform:rotate('+p.ri+'deg)">⚡</span>'+
    '<span class="amt" style="transform:rotate('+p.rt+'deg);color:rgb(125,248,255);-webkit-text-stroke-color:rgb(17,26,42)">'+p.txt+'</span></div>';
}
function panel(model,i,tag){
  const kind=model==='now'?'now':'new';
  const frame=DATA.frames[model][Math.min(i,DATA.frames[model].length-1)];
  const sorted=frame.slice().sort((a,b)=>b.age-a.age);
  return '<div class="panel"><div class="belt"></div><div class="post" style="left:70px"></div><div class="post" style="left:310px"></div>'+
    '<div class="leg" style="left:172px"></div><div class="leg" style="left:204px"></div><div class="torso"></div><div class="scarf"></div>'+
    '<div class="arm" style="left:152px"></div><div class="arm" style="left:232px"></div><div class="head"></div><div class="hair"></div>'+
    sorted.map(p=>pop(kind,p)).join('')+(tag?'<div class="tag">'+tag+'</div>':'')+'</div>';
}
// ---- plots -------------------------------------------------------------------------------------------------
function plot(w,h,xmax,ymin,ymax,opts){
  const L=44,R=10,B=30;const T=12+(opts.legend?opts.legend.length*15:0);
  const X=x=>L+(x/xmax)*(w-L-R), Y=y=>T+(1-(y-ymin)/(ymax-ymin))*(h-T-B);
  let s='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" font-family="DejaVu Sans" font-size="10.5">';
  (opts.yticks||[0,.25,.5,.75,1]).forEach(yv=>{s+='<line x1="'+L+'" x2="'+(w-R)+'" y1="'+Y(yv)+'" y2="'+Y(yv)+'" stroke="#2b3846"/><text x="'+(L-6)+'" y="'+(Y(yv)+3)+'" fill="#9db0c4" text-anchor="end">'+yv.toFixed(2)+'</text>';});
  const xs=opts.xticks;xs.forEach(xv=>{s+='<line x1="'+X(xv)+'" x2="'+X(xv)+'" y1="'+T+'" y2="'+(h-B)+'" stroke="#222d39"/><text x="'+X(xv)+'" y="'+(h-B+14)+'" fill="#9db0c4" text-anchor="middle">'+xv+'</text>';});
  s+='<text x="'+((L+w-R)/2)+'" y="'+(h-4)+'" fill="#9db0c4" text-anchor="middle">'+opts.xlabel+'</text>';
  if(opts.legend)s+=legend(opts.legend,L+6,12);
  return {svg:s,X,Y,end:()=>'</svg>'};
}
function path(P,fn,x0,x1,color,dash,wd){
  let d='';const n=120;for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;d+=(i?'L':'M')+P.X(x).toFixed(1)+' '+P.Y(fn(x)).toFixed(1);}
  return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="'+(wd||2)+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';
}
function legend(items,x,y){return items.map((it,i)=>'<g transform="translate('+x+','+(y+i*15)+')"><line x1="0" x2="18" y1="0" y2="0" stroke="'+it[1]+'" stroke-width="2.4"'+(it[2]?' stroke-dasharray="'+it[2]+'"':'')+'/><text x="24" y="3.5" fill="#cfd9e4">'+it[0]+'</text></g>').join('');}
const S=DATA.style, R=DATA.ref;
function easeOut(u,p){u=Math.min(1,Math.max(0,u));return 1-Math.pow(1-u,p);}
function back(u,c){u=Math.min(1,Math.max(0,u));const v=u-1;return 1+(c+1)*v*v*v+c*v*v;}
function plotTravel(){
  const P=plot(520,300,0.8,0,1.1,{legend:[['now: Quad-out over 1.35 s','#ff9aa2','5 4'],['video fit, Quad-out 0.31 s (worse)','#7a8896','2 3'],['proposal: Cubic-out 0.40 s','#7dffa6'],['dots: 4 popups hand-tracked in the clip','#ffd166']],yticks:[0,.25,.5,.75,1],xticks:[0,.2,.4,.6,.8],xlabel:'seconds since the popup was born'});
  let s=P.svg;
  s+=path(P,t=>easeOut(t/1.35,2),0,0.8,'#ff9aa2','5 4',2);
  s+=path(P,t=>easeOut(t/0.31,2),0,0.8,'#7a8896','2 3',1.5);
  s+=path(P,t=>easeOut(t/S.fling.time,S.fling.power),0,0.8,'#7dffa6','',2.6);
  const fit=R.ease_fit['3'];const colors={A:'#ffd166',B:'#7df8ff',D2:'#c9a7ff',F:'#ffffff'};
  for(const [name,tr] of Object.entries(R.tracks_px)){
    const info=fit.tracks[name];const rest=tr.slice(-3).reduce((a,v)=>[a[0]+v[1]/3,a[1]+v[2]/3],[0,0]);
    tr.forEach(([f,x,y])=>{const age=(f-tr[0][0])/30+info.spawn_before_first_sight_s;const d=Math.hypot(x-rest[0],y-rest[1]);const frac=1-d/info.travel_px;
      if(age>=0&&age<=0.8)s+='<circle cx="'+P.X(age)+'" cy="'+P.Y(frac)+'" r="3" fill="'+colors[name]+'" fill-opacity=".9"/>';});
  }
  return '<div class="plot"><h3>How far it has flown (share of its trip)</h3>'+s+P.end()+'<p>Points are four popups followed frame by frame (their trip length and birth moment are fitted, one number each). Cubic-out 0.40 s fits best (squared error 50; Quad-out 123; Quart-out 46 at 0.48 s). Now only 60% of the trip is done after half a second.</p></div>';
}
function plotScale(){
  const P=plot(520,300,0.3,0.3,1.25,{legend:[['now: full size from the first frame','#ff9aa2','5 4'],['proposal: 0.45 to 1.07 to 1.0 (back-out 0.28 s)','#7dffa6'],['dots: icon width of 3 popups (bar = mean, x +-1/2 frame)','#ffd166']],yticks:[.4,.6,.8,1,1.2],xticks:[0,.05,.1,.15,.2,.25,.3],xlabel:'seconds since the popup was born'});
  let s=P.svg;
  s+=path(P,t=>1,0,0.3,'#ff9aa2','5 4',2);
  s+=path(P,t=>S.pop.from+(1-S.pop.from)*back(t/S.pop.time,S.pop.back),0,0.3,'#7dffa6','',2.6);
  const widths=R.scale_samples_icon_width_px;const K=7;
  for(let k=0;k<K;k++){const vals=Object.values(widths).map(a=>a[k]).filter(v=>v!==undefined).map(v=>v/23.5);if(!vals.length)continue;
    const m=vals.reduce((a,b)=>a+b,0)/vals.length;const age=k/30+1/60;
    s+='<line x1="'+P.X(age-1/60)+'" x2="'+P.X(age+1/60)+'" y1="'+P.Y(m)+'" y2="'+P.Y(m)+'" stroke="#ffd166" stroke-width="1.5"/>';
    vals.forEach(v=>{s+='<circle cx="'+P.X(age)+'" cy="'+P.Y(v)+'" r="2.4" fill="#ffd166" fill-opacity=".55"/>';});
    s+='<circle cx="'+P.X(age)+'" cy="'+P.Y(m)+'" r="3.6" fill="#ffd166"/>';}
  return '<div class="plot"><h3>Size (1 = full size)</h3>'+s+P.end()+'<p>First sight is about 0.5 of full size, 0.7 a frame later, full size after 3 frames (0.1 s), a peak of about 1.06 (single popups up to 1.13) at 0.13 s, then 1.0 by about 0.25 s.</p></div>';
}
function plotFade(){
  const P=plot(520,300,1.1,0,1.05,{legend:[['now: text Quad-in over 1.0 s','#ff9aa2','5 4'],['now: outline Quad-out over 1.0 s','#cc7a82','2 3'],['proposal: linear 0.15 s','#7dffa6'],['dots: 3 popups, text darkness','#ffd166']],yticks:[0,.25,.5,.75,1],xticks:[0,.2,.4,.6,.8,1.0],xlabel:'seconds since the fade began'});
  let s=P.svg;
  s+=path(P,t=>1-Math.pow(Math.min(1,t/1.0),2),0,1.1,'#ff9aa2','5 4',2);
  s+=path(P,t=>1-Math.pow(1-Math.min(1,t/1.0),2),0,1.1,'#cc7a82','2 3',1.5);
  s+=path(P,t=>1-Math.min(1,t/S.fade.length),0,1.1,'#7dffa6','',2.6);
  const col={G:'#ffd166',D1:'#7df8ff',D2:'#c9a7ff'};
  for(const [name,rows] of Object.entries(R.alpha_samples)){
    const pts=rows.filter(r=>r[1]<0.93&&r[1]>0.05);const n=pts.length;const mx=pts.reduce((a,r)=>a+r[0],0)/n,my=pts.reduce((a,r)=>a+r[1],0)/n;
    let sxy=0,sxx=0;pts.forEach(r=>{sxy+=(r[0]-mx)*(r[1]-my);sxx+=(r[0]-mx)**2;});const slope=sxy/sxx;const t0=mx+(0.95-my)/slope;
    rows.forEach(r=>{const x=r[0]-t0;if(x>-0.05&&x<1.1)s+='<circle cx="'+P.X(Math.max(0,x))+'" cy="'+P.Y(Math.min(1,r[1]/0.95))+'" r="3" fill="'+col[name]+'" fill-opacity=".9"/>';});
  }
  return '<div class="plot"><h3>How clear it is (1 = opaque)</h3>'+s+P.end()+'<p>The clip holds a popup opaque for about 0.5 s after it is born, then fades it in 0.09 to 0.17 s (mean 0.145 s). Ours starts at 0.35 s and takes a full second, but is cut off at ~0.67 s with the outline half gone.</p></div>';
}
// ---- the page ----------------------------------------------------------------------------------------------
function stats(model){const fr=DATA.frames[model];let sum=0,n=0,max=0;for(let i=Math.round(0.9*FPS);i<fr.length;i++){sum+=fr[i].length;n++;max=Math.max(max,fr[i].length);}return {mean:(sum/n),max};}
function buildStrip(){
  const cols=[0.30,0.50,0.70,1.00,1.40];
  const rows=[['now','now','NOW',"SpeedGainPopup.client.lua: 6 a second, 1.35 s each, rise straight up 3 to 3.8 studs, never more than 4 (the 5th removes the oldest)"],
              ['new6','new6','PROPOSED',"one popup per award (6 a second), the video's pop, fling, stop and quick fade, pixels not studs"],
              ['new12','new12','PROPOSED + split awards','each award shown as 2 equal shares (12 a second, about the video\'s 10)'],
              ['reduced','reduced','REDUCED MOTION','no fling or overshoot: appears, rises 72 px in 0.7 s, fades; sides alternate']];
  let h='<h1>Treadmill speed popups: now vs proposed</h1><p class="sub">Preview of the proposal, made before it was built. Same 1080 p screen and camera (head 44 px wide, as in the reference clip), our colours, our font, our lightning icon; "+4.2K" is one tick\'s award. The proposal is src/ReplicatedStorage/SpeedPopupStyle.lua (the module the game now uses), run by sim_popups.luau; its numbers are the ones measured from the reference clip (table and curves below). Time runs left to right from the start of a run.</p>';
  h+='<div class="grid"><div></div>'+cols.map(t=>'<div class="colhead">t = '+t.toFixed(2)+' s</div>').join('');
  rows.forEach(([key,model,title,desc])=>{
    h+='<div class="rowlab"><b>'+title+'</b><span>'+desc+'</span></div>';
    cols.forEach(t=>{h+='<div class="cellwrap">'+panel(model,Math.round(t*FPS),'')+'</div>';});
  });
  h+='</div>';
  h+='<h2>Measured from the reference clip (another game; 2560x1344, 30 fps; only these numbers are kept here)</h2>';
  h+='<div class="plots">'+plotTravel()+plotScale()+plotFade()+'</div>';
  const sn=stats('now'),s6=stats('new6'),s12=stats('new12');
  h+='<h2>Numbers side by side</h2><table><tr><th></th><th>NOW (today)</th><th>REFERENCE (measured)</th><th>PROPOSED</th></tr>'+
  '<tr><td class="k">Spawn rhythm</td><td class="n">one per server tick, 6 a second (1/6 s)</td><td class="r">one every 0.100 s (3 frames, regular), 10 a second; the legs\' step cycle is too fast for 30 fps to resolve, so it is a timer rather than a visible step</td><td class="p">one per award (6 a second, the number is the real award). Option: split each award in two shares: 12 a second</td></tr>'+
  '<tr><td class="k">Alive at once</td><td class="n">max 4 (cap); '+sn.mean.toFixed(1)+' on average once running</td><td class="r">6 to 8 (about 6 solid, 1 to 2 fading, 2 new)</td><td class="p">'+s6.mean.toFixed(1)+' on average at 6 a second; '+s12.mean.toFixed(1)+' at 12 a second (cap 8 on desktop, 6 phones, 4 low / FastMode; other players 3 / 2 / 1)</td></tr>'+
  '<tr><td class="k">Lifetime</td><td class="n">1.35 s on paper, but the cap removes it after about 0.67 s while it is still 90% opaque</td><td class="r">0.65 s (hold 0.45 to 0.50 s, fade 0.09 to 0.17 s)</td><td class="p">0.65 s: 0.50 s hold, 0.15 s linear fade; a popup retired early fades in 0.08 s</td></tr>'+
  '<tr><td class="k">Born</td><td class="n">1.25 studs above the head, full size, no pop</td><td class="r">at the head centre (within ~8 px), 0.4 to 0.6 of full size</td><td class="p">at the head (5 px up, +-6 px), 0.45 of full size</td></tr>'+
  '<tr><td class="k">Pop</td><td class="n">none</td><td class="r">about 0.5, 0.7, 0.9, 1.0, 1.06 over 5 frames, peak about 1.06 (single popups up to 1.13) at 0.13 s, 1.0 by 0.25 s</td><td class="p">0.45 to 1.0 in 0.28 s, back-out, 7% overshoot (peak 1.07 at 0.16 s)</td></tr>'+
  '<tr><td class="k">Direction</td><td class="n">straight up inside a +-15 degree cone</td><td class="r">fan above the head: -48 to +72 degrees from vertical (mean 2, sd 43, 7 popups)</td><td class="p">fan of +-75 degrees in 7 shuffled slots (+-9 degrees jitter): never two in a row on one spot</td></tr>'+
  '<tr><td class="k">Distance</td><td class="n">3.0 to 3.8 studs: about 110 to 140 px here but it follows the camera (about 1.7 times as far at the default 12.5 stud zoom)</td><td class="r">50 to 134 px of 1344 from the head (mean 97 = 1.8 head widths = 78 px at 1080 p); did not change when the camera moved about 15% in the clip</td><td class="p">44 to 104 px (mean 74) at 1080 p, scaled by screen height (0.8 to 1.35); the same at any camera distance</td></tr>'+
  '<tr><td class="k">Easing</td><td class="n">Quad-out over 1.35 s</td><td class="r">Cubic-out over 0.40 s (initial speed about 700 px/s of 1344, 50% of the trip in 0.08 s, 90% in 0.21 s), then rests</td><td class="p">Cubic-out over 0.40 s, no gravity or drift</td></tr>'+
  '<tr><td class="k">Size</td><td class="n">text 26 px, icon 24 px, box 178x48 (icon far left, gap before the number)</td><td class="r">text ~24 px, icon ~25 px of 1344 (1.8% of the height), the same size while the camera moved about 15%</td><td class="p">text 22 px, icon 20 px, icon and number together (design px at 1080 p)</td></tr>'+
  '<tr><td class="k">Look</td><td class="n">pale cyan number, navy outline, yellow bolt</td><td class="r">black number, light outline, blue shoe icon</td><td class="p">unchanged: our colours, FredokaOne, our bolt</td></tr></table>';
  h+='<p class="note">Reading the preview: the stand-in avatar is a drawing; popups are drawn by Chromium (Fredoka One and Noto Color Emoji stand in for Roblox\'s own rendering) so sizes and outlines are approximate, the MOTION numbers are exact. "Now" is modelled from the constants of SpeedGainPopup.client.lua (the Quad rise, the 4-popup cap and the 1/6 s tick) at 36.8 px per stud, the reference camera.</p>';
  document.getElementById('strip').innerHTML=h;
}
function buildGif(){
  const cols=[['now','NOW','6 a second, 4 at most'],['new6','PROPOSED','one per award, 6 a second'],['new12','PROPOSED, split awards','12 a second']];
  document.getElementById('gif').innerHTML=cols.map(([m,t,s])=>'<div class="gcol"><div class="cap">'+t+' <span>'+s+'</span></div><div id="g_'+m+'"></div></div>').join('');
  window.setGif=(i)=>{cols.forEach(([m])=>{document.getElementById('g_'+m).innerHTML=panel(m,i,'t = '+(i/FPS).toFixed(2)+' s');});};
}
buildStrip();buildGif();window.setGif(0);window.ready=true;
</script></body></html>
