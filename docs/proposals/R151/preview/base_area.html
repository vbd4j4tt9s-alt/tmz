  }
  for(const g of scene.guis||[]){
    if(view.hide&&view.hide.some(h=>g.path.includes(h)))continue;
    if(clip&&(g.p[0]<clip[0]||g.p[0]>clip[1]||g.p[2]<clip[2]||g.p[2]>clip[3]))continue;
    s.add(guiMesh(g));
  }
  if(!view.ortho){
    const R=rnd(5);
    for(const e of scene.emitters||[]){
      const pts=[];const n=Math.min(40,Math.round(e.rate*e.life*1.5));
      for(let i=0;i<n;i++){const u=R();pts.push(e.p[0]+(R()-.5)*(e.size[0]+6),e.p[1]-u*Math.max(4,e.p[1]-4.5)*(e.acc<0?1:-.3),e.p[2]+(R()-.5)*(e.size[2]+6))}
      const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
      s.add(new THREE.Points(geo,new THREE.PointsMaterial({map:glowTex,color:col(e.color),size:.9,transparent:true,depthWrite:false,sizeAttenuation:true})));
    }
  }
  for(const a of view.avatars||[])s.add(avatar(...a));
  let cam;
  if(view.ortho){const o=view.ortho; // [centre x, centre z, half width, half height]; +Z up the image, -X to the right (Roblox top view)
    cam=new THREE.OrthographicCamera(-o[2],o[2],o[3],-o[3],1,2000);cam.up.set(0,0,1);cam.position.set(o[0],900,o[1]);cam.lookAt(o[0],0,o[1]);
  }else{cam=new THREE.PerspectiveCamera(view.fov||60,W/H,.3,9000);cam.position.set(...view.pos);cam.lookAt(new THREE.Vector3(...view.look))}
  renderer.render(s,cam);const url=renderer.domElement.toDataURL('image/png');
  s.traverse(o=>{if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];for(const m of ms){if(m.map&&m.map!==glowTex)m.map.dispose();if(!Object.values(matCache).includes(m))m.dispose()}}if(o.isInstancedMesh)o.dispose()});
  return url;
};
window.ready=true;
</script></body></html>
